[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pulse_research"
version = "0.1.0"
description = "Multi-fidelity CGEM-Pulse surrogate of Gz x hypoxia G-LOC tolerance with conformal coverage"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Diego Malpica, MD", email = "dlmalpica@me.com" }]
keywords = [
    "aerospace-medicine",
    "G-LOC",
    "hypoxia",
    "multi-fidelity",
    "gaussian-process",
    "conformal-prediction",
    "CGEM",
    "Pulse-Physiology-Engine",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "SALib>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "httpx>=0.27",
]
mfgp = [
    "pymc>=5.15",
    "gpytorch>=1.12",
    "botorch>=0.11",
    "emukit>=0.5",
]
conformal = [
    "mapie>=0.9",
    "crepes>=0.7",
]
explain = [
    "xgboost>=2.0",
    "shap>=0.45",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.1",
]

[project.urls]
Homepage = "https://github.com/strikerdlm/Pulse_Research"
Repository = "https://github.com/strikerdlm/Pulse_Research"
Issues = "https://github.com/strikerdlm/Pulse_Research/issues"
"Source CGEM upstream" = "https://github.com/strikerdlm/CAMI-Gz-Effects-Model-CGEM-"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse_research"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
# N803/N806: matrix-style identifiers (X, X_train, Y, low_X) are conventional in
#            numerical code; pep8's lowercase rule does not apply to ML/stats
#            variable / argument naming.
# E501: line-length handled by the formatter.
ignore = ["E501", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# N802: test names for Sobol indices (S1, ST, S2) contain conventional uppercase
#        acronyms that trigger the function-lowercase rule.
"tests/test_sensitivity_analyze.py" = ["N802"]
# N802: test_surrogate_rejects_non_2d_X uses conventional matrix-variable uppercase
#        in the function name (mirrors the plan-specified test name verbatim).
"tests/test_explain.py" = ["N802"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "SALib.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["pulse_research"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
